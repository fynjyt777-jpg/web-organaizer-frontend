<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Антон Тертичный">
    <title>Органайзер — Менеджер заметок</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем иконки для кнопок редактирования/удаления папок -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
<div class="notes-page-wrapper" style="display: flex; height: 100vh; font-family: inherit; background-color: #f5f7fb;">

    <!-- ЛЕВАЯ ПАНЕЛЬ: Сайдбар для управления папками и ярлыками -->
    <aside class="sidebar" style="width: 280px; background: #ffffff; border-right: 1px solid #e2e8f0; padding: 20px; display: flex; flex-direction: column;">
        <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <a href="index.html" class="back-btn" style="text-decoration: none; color: #4f46e5; font-size: 13px; font-weight: bold;">◀ К календарю</a>
            <h2 style="font-size: 16px; margin: 0; color: #4a5568;">Папки</h2>
            <button id="addNewFolderBtn" style="padding: 4px 8px; font-size: 12px; cursor: pointer;">+ Папка</button>
        </div>

        <!-- Контейнер для автоматического рендеринга списка папок -->
        <div id="foldersFilterContainer" class="folders-list" style="display: flex; flex-direction: column; gap: 4px;"></div>

        <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; margin-top: 30px;">
            <h2 style="font-size: 16px; margin: 0; color: #4a5568;">Ярлыки</h2>
            <button id="addNewTagBtn" style="padding: 4px 8px; font-size: 12px; cursor: pointer;">+ Ярлык</button>
        </div>

        <!-- Контейнер для ярлыков -->
        <div id="tagsFilterContainer" class="tags-list" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
    </aside>

    <!-- ПРАВАЯ ПАНЕЛЬ: Рабочая область -->
    <main class="main-content" style="flex-grow: 1; padding: 30px; overflow-y: auto;">
        <header class="content-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px;">
            <h1 id="current-view-title" style="margin: 0; font-size: 20px; color: #1e293b;">📁 Загрузка категорий...</h1>
            <button id="openModalBtn" style="background: #4f46e5; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">+ Создать заметку</button>
        </header>

        <!-- Системные сообщения сервера -->
        <div id="message"></div>

        <!-- Сетка для вывода карточек заметок -->
        <section class="notes-grid" id="notes-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
            <!-- Заметки генерируются динамически через JS -->
        </section>
    </main>

    <!-- ВСПЛЫВАЮЩЕЕ (МОДАЛЬНОЕ) ОКНО ДЛЯ ФОРМЫ СОЗДАНИЯ -->
    <div id="noteModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4);">
        <div class="modal-content" style="background: white; margin: 10% auto; padding: 30px; width: 450px; border-radius: 8px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
            <span class="close-modal" style="position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #94a3b8;">&times;</span>
            <h3 style="margin-top: 0; margin-bottom: 20px;">Новая заметка</h3>

            <!-- Замените форму внутри #noteModal на этот вариант -->
            <form id="noteForm">
                <input type="text" id="noteTitle" placeholder="Заголовок заметки" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" required>
                <textarea id="noteContent" placeholder="Текст заметки..." style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; height: 120px;" required></textarea>

                <!-- Выбор папки (остается селектом) -->
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 13px; font-weight: bold; color: #444; display: block; margin-bottom: 5px;">Выберите папку:</label>
                    <select id="noteFolder" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;"></select>
                </div>

                <!-- ИСПРАВЛЕНО: Новый блок выбора нескольких ярлыков в модальном окне -->
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 13px; font-weight: bold; color: #444; display: block; margin-bottom: 5px;">Выберите ярлыки (можно несколько):</label>
                    <div id="noteTagsCheckboxesContainer" style="display: flex; flex-wrap: wrap; gap: 8px; background: #fafafa; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; max-height: 100px; overflow-y: auto; box-sizing: border-box;">
                        <!-- Чекбоксы сгенерируются автоматически через JS -->
                    </div>
                    <button type="button" id="addNewTagBtn2" style="padding: 6px 12px; margin-top: 8px; cursor: pointer;">+ Свой ярлык</button>
                </div>

                <button type="submit" style="background: #10b981; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold;">Сохранить в базу</button>
            </form>

        </div>
    </div>

</div>

<!-- Подключаем ваш файл логики работы с заметками -->
<script src="scriptNotes.js" defer></script>
</body>
</html>
