<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация — Органайзер</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="auth-container">
    <h2 id="form-title">Войти в аккаунт</h2>

    <form id="authForm">
        <input type="text" id="username" placeholder="Введите логин" required>
        <input type="password" id="password" placeholder="Введите пароль" required>
        <button type="submit" id="submitBtn">Войти</button>
    </form>

    <div class="toggle-form">
        <p id="toggleText">Ещё нет аккаунта? <span id="switchMode">Зарегистрироваться</span></p>
    </div>
</div>

<script src="entrance.js"></script>
</body>
</html>
